[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensky-openmeteo-hub"
version = "0.1.0"
description = "Real-time flight data integration hub (OpenSky + Open-Meteo) with an AI layer"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<0.28",
    "pika>=1.3,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "tenacity>=8.3,<9.0",
    "psycopg[binary]>=3.1,<4.0",
    "sqlparse>=0.5,<0.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<0.6",
    "pytest>=8.2,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
