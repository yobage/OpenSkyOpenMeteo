services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flighthub-rabbitmq
    # Bound to loopback only: reachable from this host (e.g. `docker exec`,
    # or the management UI via an SSH tunnel) but never from the network —
    # AMQP/management credentials should never be internet-reachable.
    ports:
      - "127.0.0.1:5672:5672"   # AMQP
      - "127.0.0.1:15672:15672" # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    env_file:
      - .env

  postgres:
    image: postgres:16-alpine
    container_name: flighthub-postgres
    # Loopback-only, same reasoning as rabbitmq above.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flighthub}
      POSTGRES_USER: ${POSTGRES_USER:-flighthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flighthub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flighthub} -d ${POSTGRES_DB:-flighthub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    env_file:
      - .env

  ingestion:
    build:
      context: .
      dockerfile: src/ingestion/Dockerfile
    container_name: flighthub-ingestion
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: src/consumer/Dockerfile
    container_name: flighthub-consumer
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq
      POSTGRES_HOST: postgres
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: src/dashboard/Dockerfile
    container_name: flighthub-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
