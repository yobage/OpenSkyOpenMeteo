services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flighthub-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    env_file:
      - .env

  ingestion:
    build:
      context: .
      dockerfile: src/ingestion/Dockerfile
    container_name: flighthub-ingestion
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
